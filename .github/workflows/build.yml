name: Hexis Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev qt6-base-dev python3-pytest python3-cffi python3-typer python3-rich
        
    - name: Configure CMake
      run: cmake -S . -B build
      
    - name: Build Code
      run: cmake --build build
      
    - name: Run C Unit Tests
      run: ./build/tests/c/test_core
      
    - name: Run Python Tests
      env:
        PYTHONPATH: python
      run: pytest-3 tests/python/
