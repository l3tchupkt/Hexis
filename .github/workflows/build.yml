name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_ALL_LINUX: "if command -v dnf >/dev/null 2>&1; then dnf install -y libusb1-devel; elif command -v yum >/dev/null 2>&1; then yum install -y libusb1-devel; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libusb-1.0-0-dev; else echo 'Unsupported package manager for libusb install'; exit 1; fi"
          CIBW_BEFORE_BUILD: pip install cmake cffi
          
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build sdist
        run: pipx run build --sdist
        
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          
  test_core:
    name: Run Core Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev cmake
      - name: Build and Test
        run: |
          mkdir build && cd build
          cmake ..
          cmake --build .
          ctest --output-on-failure

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, test_core]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
          
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
