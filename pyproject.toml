[build-system]
requires = ["setuptools>=61.0.0", "wheel", "cffi>=1.15.0", "cmake>=3.25"]
build-backend = "setuptools.build_meta"

[project]
name = "hexiskit"
version = "0.1.1"
description = "Universal Hardware Pentesting & Firmware Analysis Framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cffi>=1.15.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
hexis = "hexis.cli:app"
