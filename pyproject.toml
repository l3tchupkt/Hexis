[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexis"
version = "1.0.0"
description = "A professional cross-platform hardware pentesting framework."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cffi>=1.15.0",
    "typer>=0.9.0",
]

[project.scripts]
hexis = "hexis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["python/hexis"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
